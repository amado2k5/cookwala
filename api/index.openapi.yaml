                  $ref: https://cookwala.ai/v1/schemas/relief.schema.json#/$defs/ImpactReport
components:
  parameters:
    RecipeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,63}$
    Lang:
      name: lang
      in: path
      required: true
      schema:
        type: string
    LangQuery:
      name: lang
      in: query
      schema:
        type: string
        default: en
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    SubmissionAccepted:
      type: object
      required: [submissionId, status]
      properties:
        submissionId:
          type: string
        status:
          enum: [queued, checking, pull_request_open, merged, rejected]
        pullRequestUrl:
          type: string
        issues:
          type: array
          items:
            type: string
          description: Populated when status is rejected or checking found problems.
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    SearchResult:
      type: object
      required:
      - items
      properties:
        total:
          type: integer
        nextCursor:
          type: string
        facets:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        items:
          type: array
          items:
            $ref: https://cookwala.ai/v1/schemas/catalog.schema.json#/$defs/IndexEntry
  responses:
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests (dynamic endpoints only). Use dumps and changes for bulk access.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    submitterToken:
      type: http
      scheme: bearer
      description: >-
        A GitHub OAuth token (proves the submitter's login, so submissions are checked against
        the prefixes that login owns in recipes/community/NAMESPACES.json) or a publish token
        bound to a namespace verified by DNS TXT or /.well-known/cookwala-verify (RFC-0002's
        proof methods, reused here rather than inventing a second one).
