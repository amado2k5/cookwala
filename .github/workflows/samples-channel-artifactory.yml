name: Artifactory channel test

# Proves samples/packaging/artifactory/publish.sh end to end: a throwaway Artifactory OSS container,
# four OSS-supported local repositories, the real publish script, then install the packages back.
# OSS covers pypi/npm/maven/generic — NuGet, Debian and RPM are Pro-only (see publish.sh header).
on:
  pull_request:
    paths: ['samples/packaging/artifactory/**', 'samples/python/**', 'samples/js/**', 'samples/java/**', '.github/workflows/samples-channel-artifactory.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Build the distributables
        run: |
          pip install build twine
          python samples/packaging/build.py
      - name: Start a throwaway Artifactory OSS
        run: |
          # Since 7.84 Artifactory refuses the bundled Derby DB unless it is explicitly allowed;
          # give the container a writable var dir carrying that system.yaml. The repositories REST
          # API is Pro-only, so the local repos come in through a bootstrap config descriptor —
          # the supported OSS path.
          mkdir -p /tmp/afvar/etc/artifactory
          printf 'shared:\n  database:\n    type: derby\n    allowNonPostgresql: true\n' > /tmp/afvar/etc/system.yaml
          cat > /tmp/afvar/etc/artifactory/artifactory.config.bootstrap.xml <<'XML'
          <config version="2">
            <localRepositories>
              <localRepository><key>cookwala-pypi-local</key><type>pypi</type><includesPattern>**/*</includesPattern><repoLayoutRef>pypi-default</repoLayoutRef></localRepository>
              <localRepository><key>cookwala-npm-local</key><type>npm</type><includesPattern>**/*</includesPattern><repoLayoutRef>npm-default</repoLayoutRef></localRepository>
              <localRepository><key>cookwala-maven-local</key><type>maven</type><includesPattern>**/*</includesPattern><repoLayoutRef>maven-2-default</repoLayoutRef></localRepository>
              <localRepository><key>cookwala-generic-local</key><type>generic</type><includesPattern>**/*</includesPattern><repoLayoutRef>simple-default</repoLayoutRef></localRepository>
            </localRepositories>
          </config>
          XML
          sudo chmod -R 777 /tmp/afvar
          docker run -d --name af -p 8081:8081 -p 8082:8082 -v /tmp/afvar:/var/opt/jfrog/artifactory \
            releases-docker.jfrog.io/jfrog/artifactory-oss:latest
          # Router ping/version answer long before the artifactory core registers; only the
          # readiness endpoint goes 200 once every service is up. First boot takes ~15 min.
          for i in $(seq 1 240); do
            curl -fsS http://localhost:8082/artifactory/api/v1/system/readiness | grep -q '"ready".*true' && break || sleep 5
          done
      - name: The bootstrap descriptor created the local repositories
        run: |
          # The repositories REST API is Pro-gated entirely, so prove the generic repo exists the
          # only way OSS lets us: upload into it (fails with 404 if the repo is absent).
          echo probe > /tmp/probe.txt
          for i in $(seq 1 30); do
            curl -fsS -u admin:password -T /tmp/probe.txt \
              http://localhost:8082/artifactory/cookwala-generic-local/probe.txt && break
            sleep 10
          done
          curl -fsS -u admin:password http://localhost:8082/artifactory/cookwala-generic-local/probe.txt | grep -q probe
          echo 'bootstrap descriptor imported: generic repo accepts and serves artifacts'
      - name: Run the real publish script
        env:
          ARTIFACTORY_URL: http://localhost:8082/artifactory
          ARTIFACTORY_USER: admin
          ARTIFACTORY_TOKEN: password
        run: samples/packaging/artifactory/publish.sh pypi npm maven generic
      - name: Install back what was published and run the demo
        run: |
          pip install --index-url http://admin:password@localhost:8082/artifactory/api/pypi/cookwala-pypi-local/simple cookwala-samples
          cookwala-samples demo | grep -q '3 completed'
          mvn -B -q dependency:get -Dartifact=ai.cookwala:cookwala-samples:$(cat samples/VERSION) \
            -DremoteRepositories=af::default::http://admin:password@localhost:8082/artifactory/cookwala-maven-local
          curl -fsS -u admin:password http://localhost:8082/artifactory/cookwala-generic-local/cookwala-samples/$(cat samples/VERSION)/SHA256SUMS | head -3
          echo 'pypi, maven and generic round-trips verified'
      - name: Teardown
        if: always()
        run: docker logs --tail 150 af | grep -iE "error|derby|exception|fail|ready" | tail -30 || true; docker rm -f af
