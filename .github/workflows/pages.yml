name: Validate and publish cookwala.ai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulator scenarios
        run: node sim/run.mjs
      - name: Validate specs (incl. simulated Missions)
        run: |
          pip install jsonschema pyyaml graphql-core cryptography
          python tools/validate_specs.py
      - name: Run Core conformance vectors
        run: python tools/run_conformance.py
      - name: Check humanitarian examples against the rule packs
        run: |
          python tools/humanitarian_check.py --pack profiles/humanitarian/who-codex-basic.rulepack.json --pack profiles/humanitarian/care-vulnerable-groups.rulepack.json --pack profiles/humanitarian/school-meals-basic.rulepack.json --pack profiles/humanitarian/sodium-reduction.rulepack.json examples/humanitarian/*.json examples/humanitarian/flows/*/*.json
          python tools/run_conformance.py --report /tmp/report.json
      - name: Assemble site
        run: bash tools/build_site.sh _site && find _site -type f | sort
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
