name: Recipe issue to pull request

# Turns a "Submit a recipe" issue form (docs/CONTRIBUTE-RECIPES.md, RFC-0013) into a draft pull
# request, so someone without git can still add a recipe. tools/recipe_from_issue.py does a
# best-effort parse; a maintainer reviews, fixes anything flagged in verification.notes, and
# either moves the file into the contributor's own recipes/community/<prefix>/ or merges it as
# is under the shared 'issue-' intake namespace.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'recipe-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save the issue body
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/issue-body.md
      - name: Generate the recipe file
        id: gen
        run: |
          path=$(python tools/recipe_from_issue.py /tmp/issue-body.md --number "${{ github.event.issue.number }}" --author "${{ github.event.issue.user.login }}")
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Hash the recipe
        run: |
          hash=$(python tools/cookwala_ref.py hash "${{ steps.gen.outputs.path }}")
          python - "$hash" "${{ steps.gen.outputs.path }}" <<'PY'
          import json, sys
          h, p = sys.argv[1], sys.argv[2]
          d = json.load(open(p))
          d['hash'] = h
          open(p, 'w').write(json.dumps(d, indent=1, ensure_ascii=False) + '\n')
          PY
      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="recipe-issue-${{ github.event.issue.number }}"
          git config user.name "cookwala-bot"
          git config user.email "noreply@cookwala.ai"
          git checkout -b "$branch"
          git add "${{ steps.gen.outputs.path }}"
          git commit -s -m "recipes: add submission from issue #${{ github.event.issue.number }}" \
            -m "Auto-generated by tools/recipe_from_issue.py from a 'Submit a recipe' issue form. Needs human review: see verification.notes in the file, and move it out of the shared issue- namespace into the contributor's own prefix if they have (or want) one." \
            -m "Closes #${{ github.event.issue.number }}"
          git push -u origin "$branch"
          gh pr create --draft \
            --title "recipes: $(basename "${{ steps.gen.outputs.path }}" .cookwala.json)" \
            --body "Auto-generated from #${{ github.event.issue.number }} by \`tools/recipe_from_issue.py\`. **Needs a human review before merge**: check \`verification.notes\` in the file for anything the parser flagged (unparsed quantities, missing cuisine code), confirm the rights checkbox in the issue, and move the recipe out of the shared \`issue-\` namespace into the contributor's own prefix if one is claimed. See [docs/CONTRIBUTE-RECIPES.md](../blob/main/docs/CONTRIBUTE-RECIPES.md)." \
            --base main --head "$branch"
      - name: Comment on the issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `recipe-issue-${context.issue.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `Thanks! I opened a draft pull request from this: see the branch \`${branch}\`. A maintainer will review it before it's merged — https://github.com/${context.repo.owner}/${context.repo.repo}/pulls?q=head:${branch}`,
            });
