[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookwala"
version = "0.2.0"
description = "Cookwala reference library and CLI: hash, verify, dry-run, validate and export recipes for the open standard for cooking safely (people, kitchens and robots)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Cookwala maintainers"}]
keywords = ["cooking", "robots", "food safety", "standard", "recipes"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
dependencies = []

[project.optional-dependencies]
full = ["jsonschema>=4.20", "pyyaml>=6", "graphql-core>=3.2", "cryptography>=42", "referencing>=0.30"]

[project.urls]
Homepage = "https://cookwala.ai"
Documentation = "https://cookwala.ai/docs/"
Repository = "https://github.com/amado2k5/cookwala"

[project.scripts]
cookwala = "cookwala.cli:main"

[tool.setuptools]
packages = ["cookwala"]
