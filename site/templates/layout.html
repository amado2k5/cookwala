<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  {{jsonld}}
  <link rel="alternate" type="application/json" href="/.well-known/cookwala.json" title="{{discovery_title}}">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="{{llms_title}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://cookwala.ai/assets/banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{font_link}}">
  <link rel="stylesheet" href="/assets/site.css">
  <script>try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('cw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">{{skip}}</a>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{home}}" aria-label="{{brand}}"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><radialGradient id="cw-e" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#ffb38a"/><stop offset=".55" stop-color="#ff7a45"/><stop offset="1" stop-color="#d9481c"/></radialGradient></defs><circle cx="32" cy="21" r="10" fill="url(#cw-e)"/><path d="M10 36h44a22 22 0 0 1-44 0z" fill="currentColor"/><path d="M10 36h44M4 36h6M54 36h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span class="wordmark">{{brand}}</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">{{menu}}</button>
    <nav id="menu" aria-label="{{nav_label}}">
      {{nav}}
      <details class="more"><summary>{{more_label}}</summary><div class="more-list">{{more}}</div></details>
      {{lang_menu}}
      <button class="theme-btn" type="button" aria-label="{{theme}}" title="{{theme}}"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>

<main id="main">
{{content}}
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <p class="foot-tagline">{{tagline}}</p>
    <p>{{footer_origin}}</p>
    <p class="foot-licences">{{footer_licences}}</p>
    <p class="foot-links">{{footer_links}}</p>
  </div>
</footer>
<script src="/assets/nav.js" defer></script>
{{scripts}}
</body>
</html>
