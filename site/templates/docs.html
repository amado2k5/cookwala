<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  {{jsonld}}
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{font_link}}">
  <link rel="stylesheet" href="/assets/site.css">
  <script>try{var q=new URLSearchParams(location.search).get('theme');var t=q||localStorage.getItem('cw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body class="docs-page">
<a class="skip" href="#doc">{{skip}}</a>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{home}}" aria-label="{{brand}}"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><radialGradient id="cw-e" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#ffb38a"/><stop offset=".55" stop-color="#ff7a45"/><stop offset="1" stop-color="#d9481c"/></radialGradient></defs><circle cx="32" cy="21" r="10" fill="url(#cw-e)"/><path d="M10 36h44a22 22 0 0 1-44 0z" fill="currentColor"/><path d="M10 36h44M4 36h6M54 36h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span class="wordmark">{{brand}}</span> <span class="docs-tag">Docs</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">{{menu}}</button>
    <nav id="menu" aria-label="{{nav_label}}">
      {{nav}}
      <details class="more"><summary>{{more_label}}</summary><div class="more-list">{{more}}</div></details>
      {{lang_menu}}
      <button class="theme-btn" type="button" aria-label="{{theme}}" title="{{theme}}"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>
<div class="docs wrap">
  <aside class="side" aria-label="Documentation">
    <label class="search"><span class="sr">{{filter_label}}</span><input id="filter" type="search" placeholder="{{filter_label}}" autocomplete="off"></label>
    <nav id="toc">{{sidebar}}</nav>
  </aside>
  <main id="doc" class="doc" tabindex="-1">
    <div class="doc-bar">
      <span class="crumb">{{crumb}}{{status}}</span>
      <span class="doc-actions"><button type="button" id="copyPage" data-raw="{{raw}}">{{copy}}</button><a href="{{edit}}" rel="noopener">{{edit_label}}</a><a href="{{raw}}">{{md_label}}</a></span>
    </div>
    {{notice}}
    <article class="prose">{{content}}</article>
    <nav class="pager" aria-label="Previous and next">{{pager}}</nav>
  </main>
  <aside class="onpage" aria-label="{{onpage_label}}"><p class="op-h">{{onpage_label}}</p><ul>{{onpage}}</ul></aside>
</div>
<footer class="foot"><div class="wrap foot-in"><p class="foot-links"><a href="/">cookwala.ai</a> · <a href="/docs/">Docs</a> · <a href="/llms.txt">llms.txt</a> · <a href="https://github.com/amado2k5/cookwala" rel="noopener">GitHub</a> · <a href="https://fifi.cooking">fifi.cooking</a> · <a href="https://origins.faith">origins.faith</a></p></div></footer>
<script src="/assets/nav.js" defer></script>
<script src="/assets/docs.js" defer></script>
</body>
</html>
