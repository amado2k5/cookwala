<svg viewBox="0 0 960 260" role="img" aria-label="{{s:goals.d3_what}}, {{s:goals.d3_done}}, {{s:goals.d3_never}} → {{s:goals.d3_dryrun}} → {{s:goals.d3_sensor}} / {{s:goals.d3_estimate}} / {{s:goals.d3_person}} → {{s:goals.d3_refuse}} or {{s:goals.d3_accept}} → {{s:goals.d3_log}}, {{s:goals.d3_credit}}">
        <g class="dg-boxes">
          <rect x="10" y="20" width="200" height="54" rx="10"/><text x="110" y="53" text-anchor="middle">{{s:goals.d3_what}}</text>
          <rect x="10" y="98" width="200" height="54" rx="10"/><text x="110" y="131" text-anchor="middle">{{s:goals.d3_done}}</text>
          <rect x="10" y="176" width="200" height="54" rx="10" class="dg-check"/><text x="110" y="209" text-anchor="middle">{{s:goals.d3_never}}</text>
          <rect x="300" y="98" width="180" height="54" rx="10"/><text x="390" y="131" text-anchor="middle">{{s:goals.d3_dryrun}}</text>
          <rect x="560" y="20" width="180" height="40" rx="10"/><text x="650" y="46" text-anchor="middle">1 · {{s:goals.d3_sensor}}</text>
          <rect x="560" y="80" width="180" height="40" rx="10"/><text x="650" y="106" text-anchor="middle">2 · {{s:goals.d3_estimate}}</text>
          <rect x="560" y="140" width="180" height="40" rx="10"/><text x="650" y="166" text-anchor="middle">3 · {{s:goals.d3_person}}</text>
          <rect x="560" y="200" width="180" height="40" rx="10" class="dg-check"/><text x="650" y="226" text-anchor="middle" class="dg-warn">{{s:goals.d3_refuse}}</text>
          <rect x="750" y="56" width="200" height="64" rx="10"/><text x="850" y="82" text-anchor="middle">{{s:goals.d3_accept}}</text><text x="850" y="106" text-anchor="middle">{{s:goals.d3_accept2}}</text>
          <rect x="750" y="160" width="200" height="70" rx="10"/><text x="850" y="186" text-anchor="middle">{{s:goals.d3_log}}</text><text x="850" y="212" text-anchor="middle">{{s:goals.d3_credit}}</text>
        </g>
        <g class="dg-arrows" marker-end="url(#arr-robots)">
          <line x1="210" y1="47" x2="298" y2="115"/><line x1="210" y1="125" x2="298" y2="125"/><line x1="210" y1="203" x2="298" y2="135"/>
          <line x1="480" y1="125" x2="558" y2="100"/><line x1="740" y1="100" x2="748" y2="92"/><line x1="850" y1="120" x2="850" y2="158"/>
        </g>
      </svg>
