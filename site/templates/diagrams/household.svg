<svg viewBox="0 0 960 250" role="img" aria-label="{{s:goals.hh_title}}: {{s:goals.hh_never}}; {{s:goals.hh_derived}}; {{s:goals.hh_consent}}. {{s:goals.hh_grocer}}. {{s:goals.hh_planner}}. {{s:goals.hh_erase}}">
