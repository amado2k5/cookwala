    <rect x="520" y="130" width="420" height="50" rx="10"/><text x="730" y="161" text-anchor="middle">{{s:goals.hh_planner}}</text>
  </g>
  <g class="dg-arrows" marker-end="url(#arr-household)"><line x1="290" y1="140" x2="518" y2="85"/><line x1="290" y1="140" x2="518" y2="155"/><line x1="290" y1="190" x2="518" y2="165"/></g>
  <text x="730" y="215" text-anchor="middle" class="dg-labels">{{s:goals.hh_erase}}</text>
</svg>
