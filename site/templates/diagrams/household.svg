  <g class="dg-boxes">
    <rect x="10" y="20" width="300" height="210" rx="14"/><text x="160" y="52" text-anchor="middle" class="dg-h">{{s:goals.hh_title}}</text>
    <rect x="30" y="70" width="260" height="40" rx="8" class="dg-check"/><text x="160" y="96" text-anchor="middle" class="dg-warn">{{s:goals.hh_never}}</text>
    <rect x="30" y="120" width="260" height="40" rx="8"/><text x="160" y="146" text-anchor="middle">{{s:goals.hh_derived}}</text>
    <rect x="30" y="170" width="260" height="40" rx="8"/><text x="160" y="196" text-anchor="middle">{{s:goals.hh_consent}}</text>
