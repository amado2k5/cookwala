<section class="hero wrap hero-for">
  <p class="crumb"><a href="{{home}}">Cookwala</a> / For</p>
  <h1>{{title}}</h1>
  <p class="lead">{{lead}}</p>
</section>
<section class="wrap for-grid">
  <div class="for-main">
    <h2>{{h_message}}</h2>
    <div class="prose-lite">{{message}}</div>
    <h2>{{h_options}}</h2>
    <ol class="options">{{options}}</ol>
    <h2>{{first_title}}</h2>
    <div class="first">{{first}}</div>
    <h2>{{h_flow}}</h2>
    <ol class="flow">{{flow}}</ol>
  </div>
  <aside class="for-side">
    <h2>{{h_work}}</h2>
    <ul class="ticks">{{work}}</ul>
    <h2>{{h_society}}</h2>
    <ul class="ticks">{{society}}</ul>
    <h2>{{h_links}}</h2>
    <div class="cta col">{{links}}</div>
  </aside>
</section>
<section class="band">
  <div class="wrap">
    <h2 class="small-h">{{h_others}}</h2>
    <nav class="others">{{others}}</nav>
  </div>
</section>
