image:
  repository: ghcr.io/amado2k5/cookwala-samples
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: ClusterIP
  port: 80
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
ingress:
  enabled: false
  className: ""
  host: samples.example.org
route:              # OpenShift Route instead of an Ingress
  enabled: false
  host: ""
