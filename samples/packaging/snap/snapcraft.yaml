# snapcraft --destructive-mode (from samples/packaging/snap) ; snapcraft upload --release=edge cookwala-samples_*.snap
name: cookwala-samples
version: '0.3.0'
summary: Cookwala sample clients, agents, orchestrators, gates, recovery, reporting
description: |
  Runnable samples for the Cookwala Core 0.2 API, the open standard for cooking safely.
  Runs offline on simulated devices (cookwala-samples demo) or against any Cookwala hub.
  Samples, not certified software; the executor is always the authority.
license: Apache-2.0
base: core24
grade: devel
confinement: strict

apps:
  cookwala-samples:
    command: bin/cookwala-samples
    plugs: [network, network-bind, home]

parts:
  cookwala-samples:
    plugin: python
    source: ../../python
