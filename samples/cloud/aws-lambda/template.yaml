AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cookwala samples as a Lambda function (simulated devices; gates, planner agent, orchestrator, recovery, reports)

Parameters:
  FunctionUrlAuth:
    Type: String
    AllowedValues: [AWS_IAM, NONE]
    Default: AWS_IAM
    Description: AWS_IAM keeps the Function URL private; NONE makes it public (the service never calls other hosts)

Conditions:
  PublicUrl: !Equals [!Ref FunctionUrlAuth, NONE]

Resources:
  CookwalaSamples:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      FunctionUrlConfig:
        AuthType: !Ref FunctionUrlAuth
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # AuthType NONE alone is not enough — the function's resource policy must also allow
  # lambda:InvokeFunctionUrl for the public principal. (Note: AWS still blocks anonymous
  # function-url calls on brand-new accounts regardless; the HttpApiUrl output is the
  # reliable public front door.)
  PublicUrlAccess:
    Type: AWS::Lambda::Permission
    Condition: PublicUrl
    Properties:
      FunctionName: !Ref CookwalaSamples
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Value: !GetAtt CookwalaSamplesUrl.FunctionUrl
  HttpApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1/samples
